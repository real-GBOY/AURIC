<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Client logo lockups</title>
<!--
  White client logo lockups for the dark site, rendered to transparent PNGs by
  scripts/render-logos.mjs (npm run logos) into public/clients/.
  Each .lockup is captured on its own. Marks are vector rebuilds of the originals.
-->
<style>
  @font-face { font-family: 'Geist'; src: url('../../public/fonts/geist-latin.woff2') format('woff2'); font-weight: 100 900; }
  /* Ajwadi wordmark: Chakra Petch (angular, technical). Used only to render the PNG, never shipped to visitors. */
  @font-face { font-family: 'Chakra Petch'; src: url('../../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Geist Mono'; src: url('../../public/fonts/geist-mono-latin.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  body { padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  .lockup { display: inline-flex; align-items: center; gap: 28px; padding: 18px 24px; color: #fff; }
  .name { font: 700 82px/0.95 'Geist', sans-serif; letter-spacing: -0.03em; }
  /* Large on purpose: the logo wall shows each lockup only ~84px tall, so the tagline must stay legible. */
  .sub { margin-top: 12px; font: 500 31px/1.22 'Geist Mono', monospace; letter-spacing: .03em; text-transform: uppercase; color: rgba(255,255,255,.82); }
  .ajwadi .name { font: 700 108px/0.9 'Chakra Petch', sans-serif; letter-spacing: .02em; text-transform: uppercase; }
  .atlas .name { font: 800 74px/0.95 'Geist', sans-serif; letter-spacing: 0.02em; }
  .atlas .sub { letter-spacing: .32em; }
</style>
</head>
<body>
  <!-- Ajwadi: wordmark with what the platform is, white. (Digitmask is a separate client:
       its logo is lifted straight from the supplied artwork, not drawn here.) -->
  <div class="lockup ajwadi" id="ajwadi-wordmark">
    <div>
      <div class="name">Ajwadi</div>
      <div class="sub">Platform for hiring<br />freelancers in KSA</div>
    </div>
  </div>

  <!-- Atlas: square-grid mark (26 x 26 units) with its gold accent, as in the Atlas app -->
  <div class="lockup atlas" id="atlas">
    <svg width="168" height="168" viewBox="0 0 26 26" aria-hidden="true">
      <g fill="#fff">
        <rect x="0" y="0" width="12" height="12" />
        <rect x="21" y="0" width="5" height="5" />
        <rect x="14" y="7" width="5" height="5" />
        <rect x="7" y="14" width="5" height="5" />
        <rect x="14" y="14" width="12" height="12" />
        <rect x="0" y="21" width="5" height="5" />
      </g>
      <rect x="1" y="15" width="3" height="3" fill="#DCA733" />
    </svg>
    <div>
      <div class="name">ATLAS</div>
      <div class="sub">Real estate OS</div>
    </div>
  </div>

  <!-- Social Lens: their camera-eye mark, lifted from the supplied logo and turned white
       (scripts/logos/sociallens-mark.png), with the name and what they do (from their Instagram). -->
  <div class="lockup sociallens" id="sociallens">
    <img src="sociallens-mark.png" alt="" style="height: 178px; width: auto; display: block;" />
    <div>
      <div class="name">Social Lens</div>
      <div class="sub">Media agency<br />Dubai, UAE</div>
    </div>
  </div>

  <!-- SmileSuite: the brand's own white tooth mark and wordmark (from the SmileSuite asset kit). -->
  <div class="lockup smilesuite" id="smilesuite">
    <img src="smilesuite-tooth.png" alt="" style="height: 170px; width: auto; display: block;" />
    <div>
      <img src="smilesuite-wordmark.png" alt="" style="height: 92px; width: auto; display: block;" />
      <div class="sub">Dental clinic<br />management</div>
    </div>
  </div>

  <!-- Lumen Labs: the Lumen family mark (two overlapping circles, from the platform's brand code), in white.
       In one colour the overlap is cut out so the two circles stay readable. -->
  <div class="lockup lumen" id="lumenlabs">
    <svg width="176" height="176" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="#fff" fill-rule="evenodd" d="M9 26a17 17 0 1 0 34 0a17 17 0 1 0 -34 0Z M21 38a17 17 0 1 0 34 0a17 17 0 1 0 -34 0Z" />
    </svg>
    <div>
      <div class="name">Lumen Labs</div>
      <div class="sub">Dental supplies<br />&amp; lab</div>
    </div>
  </div>
  <!-- Zaan: their wordmark (from zaan.sa) turned white, with what the product is. -->
  <div class="lockup zaan" id="zaan">
    <div>
      <img src="zaan-wordmark.png" alt="" style="height: 100px; width: auto; display: block;" />
      <div class="sub">Salon management<br />Saudi Arabia</div>
    </div>
  </div>
<script>
  window.ready = document.fonts.ready.then(() => Promise.all(['700 40px Geist', '500 20px "Geist Mono"', '700 40px "Chakra Petch"'].map((f) => document.fonts.load(f)))).then(() => Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))))));
</script>
</body>
</html>
