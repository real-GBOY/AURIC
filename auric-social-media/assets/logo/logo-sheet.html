<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC logo exports</title>
<link rel="stylesheet" href="../brand.css">
<style>
  /* Rendered by tools/render-logos.mjs into the PNGs next to this file. Geometry is Logo.tsx, unchanged. */
  .slide.sq { align-items: center; justify-content: center; }
  .slide.sq .logo { font-size: 72px; gap: 44px; }
  .slide.sq .logo .sun { width: 120px; height: 120px; }
  .slide.mark [data-sun] { width: 560px; height: 560px; }
</style>
</head>
<body>
<section class="slide sq" data-name="lockup-on-ink"><span data-logo></span></section>
<section class="slide sq cream" data-name="lockup-on-cream"><span data-logo></span></section>
<section class="slide sq gold" data-name="lockup-on-gold"><span data-logo></span></section>
<section class="slide sq mark" data-name="mark-gold-on-ink"><div data-sun></div></section>
<section class="slide sq mark gold" data-name="profile-picture"><div data-sun style="color:var(--text-dark)"></div></section>
<script src="../brand.js"></script>
</body>
</html>
