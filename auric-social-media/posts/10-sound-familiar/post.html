<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 10 — Sound familiar?</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  /* A group chat everyone running a launch has been in. */
  .phone2 { position: absolute; left: 400px; top: 480px; width: 600px; height: 1160px; border-radius: 70px; background: #050506; border: 12px solid #26262a; transform: rotate(6deg); box-shadow: 0 60px 120px rgba(0,0,0,.35); overflow: hidden; }
  .bar2 { height: 120px; background: var(--surface); display: flex; align-items: center; gap: 18px; padding: 30px 30px 0; border-bottom: 1px solid var(--line); }
  .av { width: 58px; height: 58px; border-radius: 50%; background: var(--charcoal); display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 20px; color: var(--cream); }
  .gt { color: var(--cream); font-weight: 600; font-size: 26px; } .gs { color: var(--muted); font-size: 19px; }
  .msgs { padding: 28px 26px; display: flex; flex-direction: column; gap: 18px; }
  .m { max-width: 82%; padding: 16px 22px; border-radius: 26px 26px 26px 8px; background: var(--surface-2); color: var(--cream); font-size: 25px; line-height: 1.3; }
  .m i { display: block; font-style: normal; font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .m.me { align-self: flex-end; background: var(--gold); color: var(--text-dark); border-radius: 26px 26px 8px 26px; }
  .badge { position: absolute; left: 350px; top: 455px; width: 110px; height: 110px; border-radius: 50%; background: #d64545; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 44px; z-index: 3; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .h { font-size: 128px; margin-top: 60px; }
</style>
</head>
<body>
<section class="slide cream">
  <div class="phone2">
    <div class="bar2"><span class="av">5</span><span><div class="gt">Launch — final</div><div class="gs">Designer, Developer, Editor, Marketer, You</div></span></div>
    <div class="msgs">
      <div class="m"><i>Designer</i>Which logo is the final one?</div>
      <div class="m"><i>Developer</i>Still waiting for the copy</div>
      <div class="m"><i>Editor</i>v7_FINAL_final.mp4 ?</div>
      <div class="m"><i>Marketer</i>Launch is TOMORROW</div>
      <div class="m me">…</div>
    </div>
  </div>
  <span class="badge">99+</span>
  <div class="top-bar layer"><span data-logo></span></div>
  <h1 class="mega h layer">Sound<br>familiar<i class="dot">?</i></h1>
</section>
<script src="../../assets/brand.js"></script>
</body>
</html>
