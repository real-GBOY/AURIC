<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 06 — Aim first</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  .board { position: absolute; left: 230px; top: 470px; width: 1100px; height: 1100px; }
  .h { font-size: 196px; margin-top: 70px; }
</style>
</head>
<body>
<section class="slide cream">
  <!-- target: alternating ink / cream rings with a gold bullseye, one dart in the centre -->
  <svg class="board" viewBox="0 0 1100 1100" aria-hidden="true">
    <circle cx="550" cy="550" r="540" fill="#141414"/>
    <circle cx="550" cy="550" r="450" fill="#f4f1e8"/>
    <circle cx="550" cy="550" r="360" fill="#141414"/>
    <circle cx="550" cy="550" r="270" fill="#f4f1e8"/>
    <circle cx="550" cy="550" r="180" fill="#141414"/>
    <circle cx="550" cy="550" r="92" fill="#dca733"/>
    <!-- dart, flying in from the upper left -->
    <g transform="translate(550 550) rotate(-32)">
      <rect x="-6" y="-430" width="12" height="340" rx="6" fill="#141414"/>
      <rect x="-14" y="-140" width="28" height="140" rx="8" fill="#141414"/>
      <polygon points="0,-430 -64,-560 -6,-505" fill="#dca733"/>
      <polygon points="0,-430 64,-560 6,-505" fill="#dca733"/>
      <polygon points="0,10 -14,-20 14,-20" fill="#141414"/>
    </g>
  </svg>
  <div class="top-bar layer"><span data-logo></span><span class="lab g">AURIC Strategy</span></div>
  <h1 class="mega h layer">Aim<br>first<i class="dot">.</i></h1>
  <p class="lab g layer" style="margin-top:36px;font-size:26px">Then create.</p>
</section>
<script src="../../assets/brand.js"></script>
</body>
</html>
