<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 01 — Story and LinkedIn</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  .halo { position: absolute; left: 50%; width: 2600px; height: 2600px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(220,167,51,.34) 0%, rgba(220,167,51,.10) 30%, transparent 55%); }
  /* story: same sunrise, taller sky */
  .story .rise { position: absolute; width: 2300px; height: 2300px; left: -610px; top: 980px; transform: rotate(15deg); }
  .story .halo { top: 2130px; }
  /* linkedin: the sun rises on the right */
  .li .rise { position: absolute; width: 1300px; height: 1300px; left: 420px; top: -20px; transform: rotate(15deg); }
  .li .halo { left: 1070px; top: 630px; width: 1600px; height: 1600px; }
</style>
</head>
<body>

<section class="slide story" data-name="story">
  <div class="halo"></div>
  <div class="rise" data-sun></div>
  <div class="top-bar layer"><span data-logo></span><span class="lab g">New on the feed</span></div>
  <h1 class="mega layer" style="font-size:190px;margin-top:110px;line-height:.86">Rise<br><span class="stroke-cream" style="letter-spacing:-0.02em">&amp;</span> build<i class="dot">.</i></h1>
</section>

<section class="slide li" data-name="linkedin">
  <div class="halo"></div>
  <div class="rise" data-sun></div>
  <div class="top-bar layer" style="width:520px"><span data-logo></span></div>
  <h1 class="mega layer" style="font-size:132px;margin-top:70px;line-height:.86">Rise<br><span class="stroke-cream" style="letter-spacing:-0.02em">&amp;</span> build<i class="dot">.</i></h1>
  <div class="foot layer"><span class="lab g" style="font-size:18px">Your digital partner · auric404.me</span></div>
</section>

<script src="../../assets/brand.js"></script>
</body>
</html>
