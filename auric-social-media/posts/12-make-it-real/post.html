<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 12 — Press start</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  /* An arcade START button with the AURIC sun on it. "Press start" is set in Press Start 2P, the wordmark's own font —
     the one deliberate exception to "wordmark only", because the pun is the post. */
  .pixel { font-family: 'Press Start 2P', monospace; line-height: 1.15; color: var(--cream); }
  .pixel b { font-weight: 400; color: var(--gold); }
  .btnw { position: absolute; left: 50%; top: 620px; width: 720px; height: 560px; transform: translateX(-50%); }
  .housing { position: absolute; left: 0; right: 0; top: 150px; height: 400px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #2a2a2e, #101012 70%); box-shadow: 0 50px 90px rgba(0,0,0,.6); }
  .base { position: absolute; left: 70px; right: 70px; top: 120px; height: 330px; border-radius: 50%; background: var(--gold-deep); }
  .side { position: absolute; left: 70px; right: 70px; top: 120px; height: 165px; background: var(--gold-deep); }
  .face { position: absolute; left: 70px; right: 70px; top: 20px; height: 330px; border-radius: 50%; background: radial-gradient(ellipse at 40% 35%, #f0c45a, #dca733 55%, #b88a22); box-shadow: inset 0 -10px 24px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
  .face .sun { width: 230px; height: 230px; color: var(--text-dark); transform: scaleY(.6); }
  /* LinkedIn square */
  .sq .pixel { font-size: 92px !important; margin-top: 70px !important; }
  .sq .btnw { zoom: .72; top: 600px; }
  .sq .glowb { top: 680px; }
  .glowb { position: absolute; left: 50%; top: 900px; width: 1100px; height: 700px; transform: translate(-50%,-50%); background: radial-gradient(ellipse, rgba(220,167,51,.25), transparent 62%); }
</style>
</head>
<body>
<section class="slide">
  <div class="grid-bg"></div>
  <div class="glowb"></div>
  <div class="top-bar layer"><span data-logo></span><span class="lab g">Let's make it real</span></div>
  <h1 class="pixel layer" style="font-size:112px;margin-top:110px">PRESS<br><b>START</b></h1>
  <div class="btnw">
    <div class="housing"></div><div class="base"></div><div class="side"></div>
    <div class="face"><div data-sun></div></div>
  </div>
  <div class="foot layer"><span class="handle" style="color:var(--cream)">auric404.me/contact</span><span class="handle">DM · WhatsApp</span></div>
</section>
<script src="../../assets/brand.js"></script>
</body>
</html>
