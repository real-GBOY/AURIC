<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 12 — Story</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  .pixel { font-family: 'Press Start 2P', monospace; line-height: 1.15; color: var(--cream); }
  .pixel b { font-weight: 400; color: var(--gold); }
  .btnw { position: absolute; left: 50%; top: 860px; width: 820px; height: 640px; transform: translateX(-50%); }
  .housing { position: absolute; left: 0; right: 0; top: 170px; height: 460px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #2a2a2e, #101012 70%); box-shadow: 0 50px 90px rgba(0,0,0,.6); }
  .base { position: absolute; left: 80px; right: 80px; top: 140px; height: 380px; border-radius: 50%; background: var(--gold-deep); }
  .side { position: absolute; left: 80px; right: 80px; top: 140px; height: 190px; background: var(--gold-deep); }
  .face { position: absolute; left: 80px; right: 80px; top: 24px; height: 380px; border-radius: 50%; background: radial-gradient(ellipse at 40% 35%, #f0c45a, #dca733 55%, #b88a22); box-shadow: inset 0 -10px 24px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
  .face .sun { width: 260px; height: 260px; color: var(--text-dark); transform: scaleY(.6); }
  .glowb { position: absolute; left: 50%; top: 1180px; width: 1200px; height: 800px; transform: translate(-50%,-50%); background: radial-gradient(ellipse, rgba(220,167,51,.25), transparent 62%); }
</style>
</head>
<body>
<section class="slide story" data-name="story">
  <div class="grid-bg"></div>
  <div class="glowb"></div>
  <div class="top-bar layer"><span data-logo></span><span class="lab g">Let's make it real</span></div>
  <h1 class="pixel layer" style="font-size:120px;margin-top:120px">PRESS<br><b>START</b></h1>
  <div class="btnw"><div class="housing"></div><div class="base"></div><div class="side"></div><div class="face"><div data-sun></div></div></div>
  <div class="foot layer"><span class="btn btn-gold">auric404.me/contact ↗</span></div>
</section>
<script src="../../assets/brand.js"></script>
</body>
</html>
