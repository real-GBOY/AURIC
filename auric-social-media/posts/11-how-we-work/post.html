<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 11 — Four steps up</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  /* The process as a staircase, with the sun waiting at the top. */
  .stairs { position: absolute; left: 80px; right: 80px; bottom: 0; height: 900px; }
  .st { position: absolute; bottom: 0; width: 230px; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; }
  .st .n { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 104px; line-height: .9; letter-spacing: -0.05em; }
  .st .k { font-family: 'Geist Mono', monospace; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
  .s1 { left: 0; height: 230px; background: var(--surface-2); }
  .s2 { left: 230px; height: 400px; background: var(--charcoal); }
  .s3 { left: 460px; height: 570px; background: var(--cream); color: var(--text-dark); }
  .s4 { left: 690px; height: 740px; background: var(--gold); color: var(--text-dark); }
  .topsun { position: absolute; left: 715px; bottom: 770px; width: 180px; height: 180px; }
  .h { font-size: 118px; margin-top: 70px; }
</style>
</head>
<body>
<section class="slide">
  <div class="glow"></div>
  <div class="stairs">
    <div class="st s1"><span class="k">Plan</span><span class="n stroke-cream" style="--fill:var(--surface-2)">01</span></div>
    <div class="st s2"><span class="k">Create</span><span class="n">02</span></div>
    <div class="st s3"><span class="k">Build</span><span class="n">03</span></div>
    <div class="st s4"><span class="k">Deliver</span><span class="n">04</span></div>
    <div data-sun class="topsun"></div>
  </div>
  <div class="top-bar layer"><span data-logo></span><span class="lab g">How we work</span></div>
  <h1 class="mega h layer">Four<br>steps<br>up<i class="dot">.</i></h1>
</section>
<script src="../../assets/brand.js"></script>
</body>
</html>
