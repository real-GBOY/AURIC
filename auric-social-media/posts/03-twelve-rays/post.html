<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 03 — 12 skills, 1 core</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
  .s { position: absolute; width: 470px; height: 470px; left: 305px; top: 485px; }
  .w { position: absolute; left: 540px; top: 720px; font-family: 'Geist Mono', monospace; font-size: 23px; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); white-space: nowrap; transform-origin: 0 50%; margin-top: -15px; }
  .w b { color: var(--gold); font-weight: 500; }
  .t1 { position: absolute; left: 0; right: 0; top: 178px; text-align: center; font-size: 104px; }
  .t2 { position: absolute; left: 0; right: 0; top: 1128px; text-align: center; font-size: 104px; }
  .sq .s { width: 340px; height: 340px; left: 370px; top: 390px; }
  .sq .w { top: 560px; font-size: 20px; }
  .sq .t1 { top: 140px; font-size: 84px; }
  .sq .t2 { top: 872px; font-size: 84px; }
  .sq .halo { top: 560px; width: 760px; height: 760px; }
  .halo { position: absolute; left: 540px; top: 720px; width: 900px; height: 900px; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(220,167,51,.22), transparent 60%); }
</style>
</head>
<body>
<section class="slide">
  <div class="grid-bg"></div>
  <div class="halo"></div>
  <div class="stage" id="st"><div data-sun class="s"></div></div>
  <div class="top-bar layer"><span data-logo></span><span class="lab g">How AURIC works</span></div>
  <h1 class="mega t1 layer">12 skills<i class="dot">.</i></h1>
  <h2 class="mega t2 layer"><span class="gold-t">1 core</span><i class="dot" style="color:var(--cream)">.</i></h2>
</section>
<script>
  // One word at the tip of each ray, reading outward; the left half is flipped so it stays readable.
  const W = ['Strategy', 'Content', 'Design', 'Motion', 'Video', 'Voice', 'Web', 'Apps', 'Systems', 'AI', 'Data', 'Delivery'];
  const st = document.getElementById('st');
  W.forEach((w, i) => {
    const sq = document.querySelector('.slide').classList.contains('sq') || new URLSearchParams(location.search).get('fmt') === 'li';
    const deg = i * 30 - 90, r = sq ? (i % 2 ? 150 : 176) : (i % 2 ? 212 : 246);
    const left = deg > 90 && deg < 270;
    const n = `<b>${String(i + 1).padStart(2, '0')}</b>`;
    const el = document.createElement('span');
    el.className = 'w';
    el.innerHTML = left ? `${w}&nbsp;&nbsp;${n}` : `${n}&nbsp;&nbsp;${w}`;
    el.style.transform = left
      ? `rotate(${deg}deg) translateX(${r}px) rotate(180deg) translateX(-100%)`
      : `rotate(${deg}deg) translateX(${r}px)`;
    st.appendChild(el);
  });
</script>
<script src="../../assets/brand.js"></script>
</body>
</html>
