<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURIC 08 — Right on time</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  /* The 12 rays of the AURIC sun are 12 hours: the mark becomes a clock. */
  .clock { position: absolute; left: 115px; top: 190px; width: 850px; height: 850px; }
  .h { position: absolute; left: var(--m); right: var(--m); bottom: 90px; font-size: 124px; }
</style>
</head>
<body>
<section class="slide gold">
  <svg class="clock" viewBox="0 0 64 64" aria-hidden="true" id="c"></svg>
  <div class="top-bar layer"><span data-logo></span><span class="lab">AURIC Manage</span></div>
  <h1 class="mega h layer">Right on time<i class="dot">.</i></h1>
</section>
<script>
  // Rays (Logo.tsx geometry) as hour marks, then hands pointing at 12:00 — the deadline, met.
  const c = document.getElementById('c'); let g = '';
  for (let i = 0; i < 12; i++) {
    const short = i % 2 === 1, w = short ? 4.5 : 5.8, h = short ? 9 : 14, y = short ? 5.1 : 1.3;
    g += `<rect x="${32 - w / 2}" y="${y}" width="${w}" height="${h}" rx="1.2" transform="rotate(${i * 30} 32 32)" fill="#141414"/>`;
  }
  g += '<rect x="31.1" y="17" width="1.8" height="16" rx=".9" fill="#141414" transform="rotate(0 32 32)"/>';      // minute hand → 12
  g += '<rect x="30.5" y="21.5" width="3" height="11.5" rx="1.5" fill="#141414" transform="rotate(-4 32 32)"/>'; // hour hand, a breath before 12
  g += '<circle cx="32" cy="32" r="3" fill="#141414"/><circle cx="32" cy="32" r="1.2" fill="#dca733"/>';
  c.innerHTML = g;
</script>
<script src="../../assets/brand.js"></script>
</body>
</html>
